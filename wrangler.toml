# The free web version of Postbarrel Vid Editor: static files plus one small
# Worker (worker/index.js) that keeps an anonymous daily tally of use. Its own
# Cloudflare project, nothing shared with Postbarrel.
# Security headers come from public/_headers (copied into dist/).
name = "postbarrel-vid-editor-web"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Served only at editor.postbarrel.com (Cloudflare creates its DNS record).
# The *.workers.dev test address is off. If this project is ever deleted,
# delete the editor record in the postbarrel.com zone too, so nobody else can
# claim the name.
routes = [{ pattern = "editor.postbarrel.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The tally and the free script writer go to the Worker. Everything else is served straight from dist/.
run_worker_first = ["/count", "/write"]

# The use emailed to the owner once a week, Monday 07:00 UTC. RESEND_API_KEY is a secret.
[triggers]
crons = ["0 7 * * 1"]

# Day, event, number. Nothing about anyone.
[[d1_databases]]
binding = "editor_usage"
database_name = "editor-usage"
database_id = "b0e76527-cbbd-4d66-a4bd-ad2a4f1846bb"
